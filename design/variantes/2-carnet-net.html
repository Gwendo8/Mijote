<!doctype html>
<html lang="fr" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mijote, variante 2 : Carnet net</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400..700&family=Young+Serif&display=swap" rel="stylesheet">
<style>
/* ---------- Jetons de couleur ---------- */
:root, [data-theme="light"] {
  --fond: #F6F7F9;
  --surface: #FFFFFF;
  --surface-2: #ECEFF4;
  --ligne: #DCE1E8;
  --carreau: #E9EDF3;
  --texte: #1B2430;
  --texte-2: #5D6979;
  --kcal: #2D47D6;          /* encre bleue (stylo) : calories et actions */
  --kcal-texte: #2D47D6;
  --sur-kcal: #FFFFFF;
  --prot: #1D7A4A;          /* encre verte : protéines */
  --prot-texte: #1D7A4A;
  --marge: #E5484D;         /* trait de marge du cahier */
  --erreur: #C0362C;
  --erreur-fond: #FCEDEC;
  --focus: #2D47D6;
}
[data-theme="dark"] {
  --fond: #13171F;
  --surface: #1B202A;
  --surface-2: #252B37;
  --ligne: #2E3542;
  --carreau: #1A1F28;
  --texte: #E9EDF3;
  --texte-2: #A0AABA;
  --kcal: #93A5FF;
  --kcal-texte: #A9B7FF;
  --sur-kcal: #0D1230;
  --prot: #6FD3A0;
  --prot-texte: #7FDBAC;
  --marge: #FF6B70;
  --erreur: #FF8A80;
  --erreur-fond: #3A1E22;
  --focus: #A9B7FF;
}

* { box-sizing: border-box; margin: 0; }
html { color-scheme: light dark; }
body { font-family: "Figtree", system-ui, sans-serif; background: var(--fond); color: var(--texte); line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 6px; }
.chiffre { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-variant-numeric: lining-nums; }
h1, h2, h3 { font-family: "Young Serif", Georgia, serif; font-weight: 400; }

/* ---------- Présentation de la page ---------- */
.intro { max-width: 1680px; margin: 0 auto; padding: 32px 16px 8px; display: flex; flex-wrap: wrap; gap: 16px 32px; align-items: end; justify-content: space-between; }
.intro h1 { font-size: 34px; line-height: 1.15; }
.intro p { color: var(--texte-2); max-width: 62ch; margin-top: 8px; }
.bascule { display: inline-flex; border: 1px solid var(--ligne); border-radius: 10px; padding: 3px; background: var(--surface); }
.bascule button { border: 0; background: none; padding: 7px 16px; border-radius: 7px; cursor: pointer; font-weight: 600; color: var(--texte-2); }
.bascule button[aria-pressed="true"] { background: var(--kcal); color: var(--sur-kcal); }
.ecrans { max-width: 1680px; margin: 0 auto; padding: 24px 16px 64px; display: flex; flex-wrap: wrap; gap: 32px 24px; justify-content: center; }
figure { display: flex; flex-direction: column; gap: 12px; align-items: center; }
figcaption { color: var(--texte-2); font-size: 14px; }
.tel { width: 375px; height: 780px; border-radius: 46px; border: 10px solid #0B0E13; background: var(--fond); overflow: hidden; display: flex; flex-direction: column; position: relative; }
@media (max-width: 820px) { .tel { width: 100%; max-width: 430px; border-width: 6px; border-radius: 34px; } figure { width: 100%; } }

/* ---------- Cadre d'un écran : papier à petits carreaux en haut ---------- */
.defile { flex: 1; overflow-y: auto; padding: 18px 20px 24px; scrollbar-width: none;
  background:
    linear-gradient(to bottom, transparent 0 150px, var(--fond) 230px) ,
    repeating-linear-gradient(0deg, var(--carreau) 0 1px, transparent 1px 20px),
    repeating-linear-gradient(90deg, var(--carreau) 0 1px, transparent 1px 20px),
    var(--fond);
  background-attachment: local; }
.defile::-webkit-scrollbar { display: none; }
.barre-etat { height: 34px; flex: none; display: flex; justify-content: space-between; align-items: center; padding: 0 26px; font-size: 13px; font-weight: 700; }
.nav { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-top: 1px solid var(--ligne); background: var(--surface); padding: 8px 4px 18px; }
.nav a { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; color: var(--texte-2); text-decoration: none; padding: 4px 0; position: relative; }
.nav a[aria-current="page"] { color: var(--kcal-texte); font-weight: 700; }
.nav a[aria-current="page"]::after { content: ""; position: absolute; top: -9px; width: 26px; height: 2px; background: var(--kcal); border-radius: 2px; }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }

h2.titre-ecran { font-size: 36px; line-height: 1.1; }
.sous { color: var(--texte-2); font-size: 14px; }

/* ---------- Champs ---------- */
.champ-recherche { margin-top: 14px; display: flex; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--ligne); border-radius: 12px; padding: 0 14px; height: 46px; }
.champ-recherche:focus-within { border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.champ-recherche input { border: 0; background: none; outline: none; flex: 1; height: 100%; font-size: 16px; }
.champ-recherche svg { color: var(--texte-2); }
.puces { display: flex; gap: 6px; overflow-x: auto; margin: 12px -20px 0; padding: 0 20px 4px; scrollbar-width: none; }
.puce { flex: none; border: 1px solid var(--ligne); background: var(--surface); padding: 6px 12px; border-radius: 8px; font-size: 14px; cursor: pointer; color: var(--texte-2); transition: color .15s, border-color .15s, background .15s; }
.puce:hover { color: var(--texte); border-color: var(--texte-2); }
.puce[aria-pressed="true"] { color: var(--kcal-texte); border-color: var(--kcal); background: color-mix(in srgb, var(--kcal) 9%, var(--surface)); font-weight: 600; }

/* ---------- Vignettes (photos carrées arrondies) ---------- */
.assiette { border-radius: 14px; overflow: hidden; background: var(--surface-2); flex: none; position: relative; display: grid; place-items: center; }
.assiette img { width: 100%; height: 100%; object-fit: cover; display: block; }
.assiette.vide { background:
    repeating-linear-gradient(0deg, color-mix(in srgb, var(--kcal) 14%, transparent) 0 1px, transparent 1px 8px),
    repeating-linear-gradient(90deg, color-mix(in srgb, var(--kcal) 14%, transparent) 0 1px, transparent 1px 8px),
    var(--surface); border: 1px solid var(--ligne); }
.assiette.vide span { font-family: "Young Serif", serif; color: var(--kcal-texte); font-size: 26px; line-height: 1; }

/* ---------- Liste : lignes de cahier ---------- */
.compte { margin-top: 18px; font-size: 13px; color: var(--texte-2); }
.liste { list-style: none; padding: 0 0 72px; margin-top: 4px; border-top: 1px solid var(--ligne); }
.carte { display: grid; grid-template-columns: 64px 1fr auto; gap: 14px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--ligne); text-decoration: none; color: inherit; }
.carte:hover h3 { color: var(--kcal-texte); }
.carte .assiette { width: 64px; height: 64px; }
.carte h3 { font-size: 17px; line-height: 1.2; transition: color .15s; }
.meta { display: flex; flex-wrap: wrap; gap: 2px 12px; margin-top: 4px; font-size: 13px; color: var(--texte-2); align-items: center; }
.meta span { display: inline-flex; align-items: center; gap: 4px; }
.meta .ico { width: 15px; height: 15px; }
.kcal-bloc { text-align: right; }
.kcal-bloc .chiffre { font-size: 24px; line-height: 1; display: block; color: var(--kcal-texte); }
.kcal-bloc small { font-size: 12px; color: var(--texte-2); }
.kcal-bloc .p { font-size: 13px; font-weight: 600; color: var(--prot-texte); display: block; margin-top: 2px; }
.a-completer { font-size: 13px; color: var(--texte-2); font-style: italic; border-bottom: 1px dashed var(--texte-2); }
.vide-etat { text-align: center; padding: 40px 12px; display: none; }
.vide-etat .assiette { width: 72px; height: 72px; margin: 0 auto 14px; color: var(--kcal-texte); }
.vide-etat p { color: var(--texte-2); margin: 6px 0 16px; }
.fab { position: absolute; right: 20px; bottom: 96px; height: 52px; padding: 0 20px 0 16px; border-radius: 14px; border: 0; background: var(--kcal); color: var(--sur-kcal); font-weight: 700; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 8px 20px color-mix(in srgb, var(--kcal) 35%, transparent); }

/* ---------- Fiche recette ---------- */
.fiche-haut { position: relative; }
.retour { position: absolute; left: 10px; top: 10px; z-index: 1; width: 42px; height: 42px; border-radius: 12px; border: 0; background: var(--surface); display: grid; place-items: center; cursor: pointer; }
.fiche-haut .assiette { width: 100%; height: 220px; border-radius: 20px; }
.fiche-haut h2 { margin-top: 18px; font-size: 34px; line-height: 1.1; }
.etiquettes { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.etiquette { font-size: 13px; color: var(--texte-2); border: 1px solid var(--ligne); padding: 2px 9px; border-radius: 7px; }

.chiffres { margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; border-top: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); }
.tuile { padding: 14px 0; }
.tuile + .tuile { padding-left: 16px; border-left: 1px solid var(--ligne); }
.tuile .chiffre { font-size: 40px; line-height: 1; display: block; }
.tuile.kcal .chiffre { color: var(--kcal-texte); }
.tuile.prot .chiffre { color: var(--prot-texte); }
.tuile .unite { font-size: 13px; color: var(--texte-2); }
.macros { grid-column: 1 / -1; display: flex; gap: 18px; font-size: 13px; color: var(--texte-2); padding: 10px 0; border-top: 1px solid var(--ligne); }
.macros b { color: var(--texte); }

.parts { margin-top: 18px; display: flex; align-items: center; justify-content: space-between; }
.parts strong { font-family: "Young Serif", serif; font-weight: 400; font-size: 18px; }
.pas { display: flex; align-items: center; gap: 2px; border: 1px solid var(--ligne); border-radius: 12px; background: var(--surface); padding: 3px; }
.pas button { width: 42px; height: 40px; border-radius: 9px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; color: var(--kcal-texte); }
.pas button:hover { background: var(--surface-2); }
.pas button:disabled { opacity: .35; cursor: not-allowed; }
.pas output { min-width: 34px; text-align: center; font-size: 22px; }

h3.section { margin-top: 24px; font-size: 22px; }
.ingredients { list-style: none; padding: 0; margin-top: 6px; }
.ingredients li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--ligne); }
.case { width: 22px; height: 22px; border-radius: 5px; border: 1.5px solid var(--texte-2); background: none; display: grid; place-items: center; cursor: pointer; flex: none; color: var(--kcal-texte); }
.case svg { width: 20px; height: 20px; stroke-width: 2.6; stroke-dasharray: 24; stroke-dashoffset: 24; transition: stroke-dashoffset .25s ease-out; }
.case[aria-checked="true"] { border-color: var(--kcal); }
.case[aria-checked="true"] svg { stroke-dashoffset: 0; }
.ingredients .nom { flex: 1; }
li.coche .nom { color: var(--texte-2); text-decoration: line-through; text-decoration-color: var(--kcal); }
.ingredients .g { font-variant-numeric: tabular-nums; color: var(--texte-2); }
.ingredients .neg { font-size: 12px; color: var(--texte-2); font-style: italic; }
.etapes { margin-top: 6px; padding-left: 0; list-style: none; counter-reset: e; }
.etapes li { counter-increment: e; display: grid; grid-template-columns: 28px 1fr; gap: 8px; padding: 8px 0; }
.etapes li::before { content: counter(e) "."; font-family: "Young Serif", serif; color: var(--kcal-texte); font-size: 18px; line-height: 1.3; }
.source { margin-top: 18px; font-size: 12px; color: var(--texte-2); }

/* ---------- Planning : page de cahier avec marge ---------- */
.semaine { margin-top: 14px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
.jour { border: 0; background: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 4px 0; font-size: 12px; color: var(--texte-2); }
.jour .num { width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; font-family: "Young Serif", serif; font-size: 18px; color: var(--texte); border: 2px solid transparent; }
.jour[aria-current="date"] .num { border-color: var(--kcal); color: var(--kcal-texte); transform: rotate(-4deg); border-radius: 48% 52% 50% 46%; }
.jour .plein { width: 14px; height: 2px; border-radius: 2px; background: var(--texte-2); opacity: .6; }
.total { margin-top: 16px; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 4px 12px; padding: 14px 0; border-top: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); }
.total .chiffre { font-size: 48px; line-height: 1; color: var(--kcal-texte); }
.total .chiffre small { font-size: 18px; color: var(--texte-2); }
.total .lbl { font-size: 13px; color: var(--texte-2); grid-column: 1 / -1; order: -1; }
.total .p { text-align: right; }
.total .p .chiffre { font-size: 28px; color: var(--prot-texte); }
.barre { display: none; }
.creneau { margin-top: 0; display: grid; grid-template-columns: 74px 1fr; column-gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--ligne); position: relative; }
.creneau::before { content: ""; position: absolute; left: 78px; top: 0; bottom: 0; width: 1.5px; background: color-mix(in srgb, var(--marge) 55%, transparent); }
.creneau > * { grid-column: 2; padding-left: 8px; }
.creneau-tete { grid-column: 1 !important; grid-row: 1 / span 4; padding-left: 0 !important; display: flex; flex-direction: column; }
.creneau-tete h3 { font-size: 16px; line-height: 1.2; }
.creneau-tete span { font-size: 12px; color: var(--texte-2); font-variant-numeric: tabular-nums; }
.plat { display: grid; grid-template-columns: 40px 1fr auto; gap: 10px; align-items: center; padding-top: 2px; padding-bottom: 6px; }
.plat .assiette { width: 40px; height: 40px; border-radius: 10px; }
.plat .assiette.vide span { font-size: 16px; }
.plat b { font-weight: 600; display: block; line-height: 1.25; }
.plat small { color: var(--texte-2); font-size: 12px; }
.plat .k { font-size: 18px; color: var(--kcal-texte); }
.plat.libre b { font-style: italic; font-weight: 500; }
.ajouter { margin-top: 2px; border: 0; background: none; color: var(--kcal-texte); font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer; padding: 6px 8px; justify-self: start; }
.ajouter .ico { width: 18px; height: 18px; }

/* ---------- Formulaire ---------- */
.form-tete { display: flex; align-items: center; gap: 12px; }
.form-tete h2 { font-size: 26px; line-height: 1.15; }
.groupe { margin-top: 18px; }
label.lbl, span.lbl { display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px; }
.saisie { width: 100%; height: 48px; border-radius: 12px; border: 1px solid var(--ligne); background: var(--surface); padding: 0 14px; font-size: 16px; }
.saisie:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 20%, transparent); }
.saisie[aria-invalid="true"] { border-color: var(--erreur); background: var(--erreur-fond); }
.msg-erreur { color: var(--erreur); font-size: 13px; font-weight: 600; margin-top: 6px; display: flex; gap: 6px; align-items: start; }
.ligne-aliment { display: grid; grid-template-columns: 1fr 96px; gap: 8px; }
.resultats { margin-top: 8px; background: var(--surface); border-radius: 12px; overflow: hidden; border: 1px solid var(--ligne); }
.resultats button { width: 100%; text-align: left; border: 0; background: none; padding: 10px 14px; display: grid; grid-template-columns: 1fr auto; gap: 0 12px; cursor: pointer; border-bottom: 1px solid var(--ligne); }
.resultats button:last-child { border-bottom: 0; }
.resultats button:hover, .resultats button:focus-visible { background: var(--surface-2); }
.resultats small { color: var(--texte-2); font-size: 12px; }
.resultats .chiffre { font-size: 18px; grid-row: span 2; align-self: center; color: var(--kcal-texte); }
.source-pastille { font-size: 11px; padding: 0 6px; border-radius: 5px; border: 1px solid var(--ligne); color: var(--texte-2); margin-left: 6px; }
.scan { margin-top: 10px; width: 100%; height: 46px; border-radius: 12px; border: 1px dashed var(--kcal); background: none; color: var(--kcal-texte); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
.recap { margin-top: 18px; display: flex; border-top: 1px solid var(--ligne); border-bottom: 1px solid var(--ligne); }
.recap .tuile { flex: 1; padding: 10px 0; }
.recap .tuile .chiffre { font-size: 28px; }
.actions { margin-top: 20px; display: flex; flex-direction: column; gap: 10px; }
.btn { height: 52px; border-radius: 14px; border: 0; font-weight: 700; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; }
.btn.principal { background: var(--kcal); color: var(--sur-kcal); }
.btn.principal:hover { filter: brightness(1.08); }
.btn.second { background: var(--surface); color: var(--texte); border: 1px solid var(--ligne); }
.btn:disabled { opacity: .5; cursor: not-allowed; filter: none; }
.roue { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor; border-right-color: transparent; animation: tourne .7s linear infinite; }
@keyframes tourne { to { transform: rotate(360deg); } }
.tag-choix { display: flex; flex-wrap: wrap; gap: 6px; }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition-duration: 0s !important; animation-duration: 0s !important; } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>

<header class="intro">
  <div>
    <h1>Variante 2 : Carnet net</h1>
    <p>Clair d'abord, simple et rangé. Un cahier à petits carreaux tenu au propre : titres à empattements, recettes en lignes plutôt qu'en cartes, un trait de marge rouge dans le planning. Les calories sont écrites à l'encre bleue du stylo, les protéines à l'encre verte.</p>
  </div>
  <div class="bascule" role="group" aria-label="Mode d'affichage">
    <button type="button" data-theme-btn="light" aria-pressed="true">Clair</button>
    <button type="button" data-theme-btn="dark" aria-pressed="false">Sombre</button>
  </div>
</header>

<main class="ecrans">

  <!-- 1. Liste des recettes -->
  <figure>
    <div class="tel">
      <div class="barre-etat"><span>9:41</span><span>5G</span></div>
      <div class="defile">
        <h2 class="titre-ecran">Recettes</h2>
        <div class="champ-recherche">
          <svg class="ico"><use href="#i-loupe"/></svg>
          <label class="sr" for="cherche">Chercher une recette</label>
          <input id="cherche" type="search" placeholder="Chercher une recette, un ingrédient">
        </div>
        <div class="puces" id="puces"></div>
        <p class="compte" id="compte"></p>
        <ul class="liste" id="liste"></ul>
        <div class="vide-etat" id="vide">
          <div class="assiette vide"><svg class="ico"><use href="#i-loupe"/></svg></div>
          <strong>Aucune recette trouvée</strong>
          <p id="vide-texte"></p>
          <button class="btn second" type="button" id="vide-reset" style="margin:0 auto;padding:0 18px">Voir toutes les recettes</button>
        </div>
      </div>
      <button class="fab" type="button"><svg class="ico"><use href="#i-plus"/></svg>Nouvelle recette</button>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#" aria-current="page"><svg class="ico"><use href="#i-livre"/></svg>Recettes</a>
        <a href="#"><svg class="ico"><use href="#i-idee"/></svg>Idées</a>
        <a href="#"><svg class="ico"><use href="#i-cal"/></svg>Planning</a>
        <a href="#"><svg class="ico"><use href="#i-panier"/></svg>Courses</a>
        <a href="#"><svg class="ico"><use href="#i-pomme"/></svg>Aliments</a>
      </nav>
    </div>
    <figcaption>Liste des recettes : filtre par étiquette, recherche, recettes sans photo</figcaption>
  </figure>

  <!-- 2. Fiche recette -->
  <figure>
    <div class="tel">
      <div class="barre-etat"><span>9:41</span><span>5G</span></div>
      <div class="defile">
        <div class="fiche-haut">
          <button class="retour" type="button" aria-label="Retour aux recettes"><svg class="ico"><use href="#i-retour"/></svg></button>
          <div class="assiette"><img src="img/shakshuka.jpg" alt="Shakshuka dans sa poêle"></div>
          <h2>Shakshuka</h2>
          <div class="meta"><span><svg class="ico"><use href="#i-horloge"/></svg>15 min + 20 min de cuisson</span></div>
          <div class="etiquettes"><span class="etiquette">Végé</span><span class="etiquette">Rapide</span><span class="etiquette">Riche en protéines</span></div>
        </div>
        <div class="chiffres">
          <div class="tuile kcal"><span class="chiffre" id="f-kcal">270</span><span class="unite">kcal par part</span></div>
          <div class="tuile prot"><span class="chiffre" id="f-prot">17 g</span><span class="unite">protéines par part</span></div>
          <p class="macros"><span>Glucides <b>15 g</b></span><span>Lipides <b>16 g</b></span></p>
        </div>
        <div class="parts">
          <strong>Parts</strong>
          <div class="pas">
            <button type="button" id="moins" aria-label="Une part de moins"><svg class="ico"><use href="#i-moins"/></svg></button>
            <output id="nb-parts" class="chiffre" aria-live="polite">2</output>
            <button type="button" id="plus" aria-label="Une part de plus"><svg class="ico"><use href="#i-plus"/></svg></button>
          </div>
        </div>
        <h3 class="section">Ingrédients</h3>
        <ul class="ingredients" id="ingredients"></ul>
        <h3 class="section">Étapes</h3>
        <ol class="etapes">
          <li>Faire revenir l'oignon et le poivron émincés dans l'huile, 5 minutes.</li>
          <li>Ajouter les tomates et le cumin, laisser mijoter 10 minutes.</li>
          <li>Creuser 4 puits, y casser les œufs, couvrir et cuire 6 à 8 minutes.</li>
          <li>Parsemer de coriandre au moment de servir.</li>
        </ol>
        <p class="source">Calculé avec Ciqual. Ta recette, visible par toi seule.</p>
      </div>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#" aria-current="page"><svg class="ico"><use href="#i-livre"/></svg>Recettes</a>
        <a href="#"><svg class="ico"><use href="#i-idee"/></svg>Idées</a>
        <a href="#"><svg class="ico"><use href="#i-cal"/></svg>Planning</a>
        <a href="#"><svg class="ico"><use href="#i-panier"/></svg>Courses</a>
        <a href="#"><svg class="ico"><use href="#i-pomme"/></svg>Aliments</a>
      </nav>
    </div>
    <figcaption>Fiche recette : changer le nombre de parts recalcule les grammes</figcaption>
  </figure>

  <!-- 3. Planning -->
  <figure>
    <div class="tel">
      <div class="barre-etat"><span>9:41</span><span>5G</span></div>
      <div class="defile">
        <h2 class="titre-ecran">Planning</h2>
        <p class="sous">Semaine du 16 au 22 novembre</p>
        <div class="semaine" id="semaine"></div>
        <div class="total">
          <div>
            <span class="chiffre">1 495 <small>kcal</small></span>
          </div>
          <div class="p"><span class="chiffre">93 g</span><br><span class="sous">protéines</span></div>
          <span class="lbl">Prévu jeudi 19 novembre</span>
          <div class="barre" aria-hidden="true">
            <i style="width:25%;background:var(--kcal)"></i><i style="width:35%;background:var(--kcal);opacity:.75"></i><i style="width:22%;background:var(--kcal);opacity:.5"></i><i style="width:18%;background:var(--kcal);opacity:.3"></i>
          </div>
        </div>
        <div id="creneaux"></div>
      </div>
      <nav class="nav" aria-label="Navigation principale">
        <a href="#"><svg class="ico"><use href="#i-livre"/></svg>Recettes</a>
        <a href="#"><svg class="ico"><use href="#i-idee"/></svg>Idées</a>
        <a href="#" aria-current="page"><svg class="ico"><use href="#i-cal"/></svg>Planning</a>
        <a href="#"><svg class="ico"><use href="#i-panier"/></svg>Courses</a>
        <a href="#"><svg class="ico"><use href="#i-pomme"/></svg>Aliments</a>
      </nav>
    </div>
    <figcaption>Planning d'une journée : total des calories, plats et texte libre</figcaption>
  </figure>

  <!-- 4. Formulaire -->
  <figure>
    <div class="tel">
      <div class="barre-etat"><span>9:41</span><span>5G</span></div>
      <div class="defile">
        <div class="form-tete">
          <button class="retour" style="position:static" type="button" aria-label="Annuler"><svg class="ico"><use href="#i-retour"/></svg></button>
          <h2>Nouvelle idée de plat</h2>
        </div>
        <div class="groupe">
          <label class="lbl" for="titre">Nom du plat</label>
          <input class="saisie" id="titre" value="Bol skyr fruits rouges">
        </div>
        <div class="groupe">
          <label class="lbl" for="aliment">Ajouter un aliment</label>
          <div class="ligne-aliment">
            <input class="saisie" id="aliment" value="skyr">
            <input class="saisie" id="grammes" value="un pot" aria-invalid="true" aria-describedby="err-g" aria-label="Poids en grammes">
          </div>
          <p class="msg-erreur" id="err-g"><svg class="ico" style="width:16px;height:16px"><use href="#i-alerte"/></svg>Indique un poids en grammes, par exemple 150.</p>
          <div class="resultats" role="listbox" aria-label="Aliments trouvés">
            <button type="button" role="option"><span>Skyr nature<span class="source-pastille">Ciqual</span></span><span class="chiffre">63</span><small>pour 100 g, 11 g de protéines</small></button>
            <button type="button" role="option"><span>Skyr vanille, Siggi's<span class="source-pastille">Open Food Facts</span></span><span class="chiffre">78</span><small>pour 100 g, 9 g de protéines</small></button>
            <button type="button" role="option"><span>Skyr maison 0 %<span class="source-pastille">Mon aliment</span></span><span class="chiffre">57</span><small>pour 100 g, 10 g de protéines</small></button>
          </div>
          <button class="scan" type="button"><svg class="ico"><use href="#i-code"/></svg>Scanner un code-barres</button>
        </div>
        <div class="groupe">
          <span class="lbl">Étiquettes</span>
          <div class="tag-choix">
            <button class="puce" type="button" aria-pressed="true">Petit-déj</button>
            <button class="puce" type="button" aria-pressed="true">Riche en protéines</button>
            <button class="puce" type="button" aria-pressed="false">Rapide</button>
            <button class="puce" type="button" aria-pressed="false">Léger</button>
          </div>
        </div>
        <div class="recap">
          <div class="tuile kcal"><span class="chiffre">212</span><span class="unite">kcal</span></div>
          <div class="tuile prot"><span class="chiffre">27 g</span><span class="unite">protéines</span></div>
        </div>
        <div class="actions">
          <button class="btn principal" type="button" id="enregistrer">Enregistrer l'idée</button>
          <button class="btn principal" type="button" disabled><span class="roue"></span>Enregistrement…</button>
        </div>
      </div>
    </div>
    <figcaption>Formulaire : recherche d'aliment, erreur sous le champ, bouton en cours d'envoi</figcaption>
  </figure>

</main>

<script>
/* ---------- Données d'exemple (champs réels du schéma) ---------- */
const recettes = [
  { titre: "Shakshuka", photo: "shakshuka.jpg", min: 35, parts: 2, kcal: 270, prot: 17, tags: ["Végé", "Rapide", "Riche en protéines"] },
  { titre: "Bolognaise aux petits pois", photo: "bolognaise.jpg", min: 45, parts: 4, kcal: 486, prot: 31, tags: ["Plat", "Batch cooking"] },
  { titre: "Dal aux épinards", photo: "dal.jpg", min: 40, parts: 4, kcal: 398, prot: 19, tags: ["Végé", "Plat", "Batch cooking"] },
  { titre: "Overnight oats au skyr", photo: null, min: 5, parts: 1, kcal: 380, prot: 29, tags: ["Petit-déj", "Rapide", "Riche en protéines"] },
  { titre: "Banana bread", photo: "bananabread.jpg", min: 70, parts: 8, kcal: 245, prot: 5, tags: ["Dessert", "Collation"] },
  { titre: "Pad thaï de Léa", photo: null, min: 30, parts: 2, kcal: null, prot: null, tags: ["Plat"], par: "Léa" },
];
const filtres = ["Toutes", "Végé", "Rapide", "Batch cooking", "Riche en protéines", "Dessert"];
const ingredients = [
  { nom: "œufs", qte: 4, unite: "", g: 200 },
  { nom: "tomates concassées", g: 400 },
  { nom: "poivron rouge", qte: 1, unite: "", g: 150 },
  { nom: "oignon", qte: 1, unite: "", g: 100 },
  { nom: "huile d'olive", g: 10 },
  { nom: "pincée de cumin", neg: true },
  { nom: "coriandre fraîche", neg: true },
];
const jours = [["lun", 16, 1], ["mar", 17, 1], ["mer", 18, 1], ["jeu", 19, 1], ["ven", 20, 1], ["sam", 21, 0], ["dim", 22, 0]];
const creneaux = [
  { nom: "Petit-déj", plats: [{ t: "Overnight oats au skyr", p: "1 part", k: 380, photo: null }] },
  { nom: "Midi", plats: [{ t: "Poulet, riz, patate douce", p: "Idée de plat, 1 part", k: 520, photo: "poulet.jpg" }] },
  { nom: "Collation", plats: [{ t: "Banana bread", p: "1 part", k: 245, photo: "bananabread.jpg" }, { t: "Une pomme", p: "Texte libre", k: 80, libre: true }] },
  { nom: "Soir", plats: [{ t: "Shakshuka", p: "1 part", k: 270, photo: "shakshuka.jpg" }] },
];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const nombre = n => n.toLocaleString("fr-FR");
const assiette = (photo, titre, cls = "") => photo
  ? `<div class="assiette ${cls}"><img src="img/${photo}" alt=""></div>`
  : `<div class="assiette vide ${cls}" aria-hidden="true"><span>${esc(titre[0])}</span></div>`;
const duree = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? String(m % 60).padStart(2, "0") : ""}` : `${m} min`;

/* ---------- Écran 1 : liste ---------- */
let filtre = "Toutes", texte = "";
const elPuces = document.getElementById("puces");
elPuces.innerHTML = filtres.map(f => `<button class="puce" type="button" aria-pressed="${f === filtre}">${f}</button>`).join("");
elPuces.addEventListener("click", e => {
  const b = e.target.closest(".puce"); if (!b) return;
  filtre = b.textContent; elPuces.querySelectorAll(".puce").forEach(x => x.setAttribute("aria-pressed", x === b)); rendreListe();
});
document.getElementById("cherche").addEventListener("input", e => { texte = e.target.value.trim().toLowerCase(); rendreListe(); });
document.getElementById("vide-reset").addEventListener("click", () => {
  filtre = "Toutes"; texte = ""; document.getElementById("cherche").value = "";
  elPuces.querySelectorAll(".puce").forEach((x, i) => x.setAttribute("aria-pressed", i === 0)); rendreListe();
});
function rendreListe() {
  const vues = recettes.filter(r => (filtre === "Toutes" || r.tags.includes(filtre)) && r.titre.toLowerCase().includes(texte));
  document.getElementById("compte").textContent = `${vues.length} recette${vues.length > 1 ? "s" : ""}`;
  document.getElementById("liste").innerHTML = vues.map(r => `
    <li><a class="carte" href="#">
      ${assiette(r.photo, r.titre)}
      <div>
        <h3>${esc(r.titre)}</h3>
        <div class="meta">
          <span><svg class="ico"><use href="#i-horloge"/></svg>${duree(r.min)}</span>
          <span><svg class="ico"><use href="#i-parts"/></svg>${r.parts} part${r.parts > 1 ? "s" : ""}</span>
          ${r.par ? `<span class="partage"><svg class="ico"><use href="#i-partage"/></svg>de ${esc(r.par)}</span>` : ""}
        </div>
      </div>
      <div class="kcal-bloc">${r.kcal
        ? `<span class="chiffre">${r.kcal}</span><small>kcal/part</small><span class="p">${r.prot} g prot.</span>`
        : `<span class="a-completer">kcal à compléter</span>`}</div>
    </a></li>`).join("");
  const vide = vues.length === 0;
  document.getElementById("vide").style.display = vide ? "block" : "none";
  document.getElementById("compte").style.display = vide ? "none" : "block";
  document.getElementById("vide-texte").textContent = texte
    ? `Aucune recette ne contient « ${texte} ». Essaie un autre mot, ou ajoute-la.`
    : `Aucune recette avec l'étiquette ${filtre} pour l'instant.`;
}
rendreListe();

/* ---------- Écran 2 : fiche, parts ---------- */
let parts = 2;
function rendreIngredients() {
  const f = parts / 2;
  document.getElementById("ingredients").innerHTML = ingredients.map((i, n) => `
    <li><button class="case" type="button" role="checkbox" aria-checked="false" aria-label="${esc(i.nom)} : pris"><svg class="ico"><use href="#i-coche"/></svg></button>
      <span class="nom">${i.qte ? `${Math.round(i.qte * f * 10) / 10} ` : ""}${esc(i.nom)}</span>
      ${i.neg ? `<span class="neg">négligeable</span>` : `<span class="g">${nombre(Math.round(i.g * f))} g</span>`}</li>`).join("");
}
document.getElementById("ingredients").addEventListener("click", e => {
  const c = e.target.closest(".case"); if (!c) return;
  const on = c.getAttribute("aria-checked") !== "true";
  c.setAttribute("aria-checked", on); c.closest("li").classList.toggle("coche", on);
});
const out = document.getElementById("nb-parts");
function changerParts(d) {
  parts = Math.min(12, Math.max(1, parts + d));
  out.textContent = parts;
  document.getElementById("moins").disabled = parts === 1;
  out.animate?.([{ transform: "translateY(-6px)", opacity: .2 }, { transform: "none", opacity: 1 }], { duration: matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 220, easing: "cubic-bezier(.2,.8,.2,1)" });
  rendreIngredients();
}
document.getElementById("moins").onclick = () => changerParts(-1);
document.getElementById("plus").onclick = () => changerParts(1);
rendreIngredients();

/* ---------- Écran 3 : planning ---------- */
document.getElementById("semaine").innerHTML = jours.map(([j, n, plein]) =>
  `<button class="jour" type="button" ${n === 19 ? 'aria-current="date"' : ""}><span>${j}</span><span class="num">${n}</span>${plein ? '<span class="plein"></span>' : '<span style="height:5px"></span>'}</button>`).join("");
document.getElementById("creneaux").innerHTML = creneaux.map(c => {
  const tot = c.plats.reduce((s, p) => s + p.k, 0);
  return `<section class="creneau"><div class="creneau-tete"><h3>${c.nom}</h3><span>${tot} kcal</span></div>
    ${c.plats.map(p => `<div class="plat ${p.libre ? "libre" : ""}">${assiette(p.libre ? null : p.photo, p.t)}
      <div><b>${esc(p.t)}</b><small>${p.p}</small></div><span class="chiffre k">${p.k}</span></div>`).join("")}
    ${c.nom === "Soir" ? `<button class="ajouter" type="button"><svg class="ico"><use href="#i-plus"/></svg>Ajouter au soir</button>` : ""}
  </section>`;
}).join("");

/* ---------- Mode clair / sombre ---------- */
const racine = document.documentElement;
function theme(t) { racine.dataset.theme = t; document.querySelectorAll("[data-theme-btn]").forEach(b => b.setAttribute("aria-pressed", b.dataset.themeBtn === t)); }
document.querySelectorAll("[data-theme-btn]").forEach(b => b.onclick = () => theme(b.dataset.themeBtn));
theme(matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
</script>
</body>
</html>
