<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d1a" />
    <title>Mijote</title>
    <script>
      // Applique le thème choisi avant l'affichage (évite un flash). Clair par défaut.
      try {
        var t = localStorage.getItem('mijote-theme');
        if (t === 'dark' || t === 'auto' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
        }
      } catch {
        /* stockage indisponible : thème clair */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
